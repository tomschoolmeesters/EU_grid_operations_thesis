name: Documentation

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: '1.9'

      - name: Install dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate();'

      - name: Build Docs
        run: julia --project=docs docs/make.jl
        env:
          CI: "true"